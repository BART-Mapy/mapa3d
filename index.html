        let targetCount = Math.floor(area * SCRUB_BUSH_DENSITY);
        targetCount = Math.min(targetCount, MAX_SCRUB_BUSHES - totalPlaced);
        if (targetCount <= 0) continue;

        let minX = Infinity;
        let maxX = -Infinity;
        let minZ = Infinity;
        let maxZ = -Infinity;
        for (const point of ring) {
          minX = Math.min(minX, point.x);
          maxX = Math.max(maxX, point.x);
          minZ = Math.min(minZ, point.z);
          maxZ = Math.max(maxZ, point.z);
        }
        minX = Math.max(minX, -SECTOR_HALF);
        maxX = Math.min(maxX, SECTOR_HALF);
        minZ = Math.min(minZ, -SECTOR_HALF);
        maxZ = Math.min(maxZ, SECTOR_HALF);
        if (maxX <= minX || maxZ <= minZ) continue;

        let placed = 0;
        let attempts = 0;
        const maxAttempts = targetCount * 20;

        while (placed < targetCount && attempts < maxAttempts) {
          attempts += 1;
          const x = minX + random() * (maxX - minX);
          const z = minZ + random() * (maxZ - minZ);
          if (!pointInPolygon(x, z, ring)) continue;
          if (!isInsideSector(x, z)) continue;
          if (pointInsideAnyFootprint(x, z, buildingFootprints)) continue;
          if (pointNearRoadClearance(x, z, roadClearanceSegments)) continue;

          const key = bushGridKey(x, z);
          if (occupied.has(key)) continue;
          occupied.add(key);

          bushes.push({
            x,
            z,
            height: MIN_BUSH_HEIGHT + random() * (MAX_BUSH_HEIGHT - MIN_BUSH_HEIGHT),
            rotation: random() * Math.PI * 2,
          });
          placed += 1;
          totalPlaced += 1;
        }
      }

      return bushes;
    }

    function buildBushInstances(bushes, bushMaterial) {
      if (bushes.length === 0) return;

      const blobGeometry = new THREE.SphereGeometry(1, 8, 6);
      const lowerMesh = new THREE.InstancedMesh(blobGeometry, bushMaterial, bushes.length);
      const upperMesh = new THREE.InstancedMesh(blobGeometry, bushMaterial, bushes.length);
      lowerMesh.frustumCulled = false;
      upperMesh.frustumCulled = false;

      for (let i = 0; i < bushes.length; i += 1) {
        const bush = bushes[i];
        const height = bush.height;
        const baseRadius = height * 0.42;

        dummy.position.set(bush.x, Y_BUSH + height * 0.28, bush.z);
        dummy.rotation.set(0, bush.rotation, 0);
        dummy.scale.set(baseRadius * 1.12, height * 0.34, baseRadius * 0.95);
        dummy.updateMatrix();
        lowerMesh.setMatrixAt(i, dummy.matrix);

        dummy.position.set(bush.x, Y_BUSH + height * 0.62, bush.z);
        dummy.rotation.set(0, bush.rotation, 0);
        dummy.scale.set(baseRadius * 0.82, height * 0.36, baseRadius * 0.78);
        dummy.updateMatrix();
        upperMesh.setMatrixAt(i, dummy.matrix);
      }

      dummy.scale.set(1, 1, 1);
      dummy.rotation.set(0, 0, 0);
      lowerMesh.instanceMatrix.needsUpdate = true;
      upperMesh.instanceMatrix.needsUpdate = true;
      lowerMesh.renderOrder = 6.5;
      upperMesh.renderOrder = 6.6;
      worldGroup.add(lowerMesh);
      worldGroup.add(upperMesh);
    }

    function buildTreeInstances(trees, trunkGeometry, crownGeometry, trunkMaterial, crownMaterial, crownIsSphere) {
      if (trees.length === 0) return;

      const trunkMesh = new THREE.InstancedMesh(trunkGeometry, trunkMaterial, trees.length);
      const crownMesh = new THREE.InstancedMesh(crownGeometry, crownMaterial, trees.length);
      trunkMesh.frustumCulled = false;
      crownMesh.frustumCulled = false;

      for (let i = 0; i < trees.length; i += 1) {
        const tree = trees[i];
        const height = tree.height;
        const trunkHeight = height * 0.36;
        const crownHeight = height - trunkHeight;
        const trunkRadius = THREE.MathUtils.clamp(height * 0.028, 0.14, 0.42);
        const crownRadius = height * 0.26;

        dummy.position.set(tree.x, Y_TREE + trunkHeight * 0.5, tree.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(trunkRadius, trunkHeight, trunkRadius);
        dummy.updateMatrix();
        trunkMesh.setMatrixAt(i, dummy.matrix);

        if (crownIsSphere) {
          dummy.position.set(tree.x, Y_TREE + trunkHeight + crownRadius * 0.82, tree.z);
          dummy.scale.set(crownRadius, crownRadius, crownRadius);
        } else {
          dummy.position.set(tree.x, Y_TREE + trunkHeight + crownHeight * 0.5, tree.z);
          dummy.scale.set(crownRadius, crownHeight, crownRadius);
        }
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        crownMesh.setMatrixAt(i, dummy.matrix);
      }

      dummy.scale.set(1, 1, 1);
      trunkMesh.instanceMatrix.needsUpdate = true;
      crownMesh.instanceMatrix.needsUpdate = true;
      trunkMesh.renderOrder = 7;
      crownMesh.renderOrder = 8;
      worldGroup.add(trunkMesh);
      worldGroup.add(crownMesh);
    }

    function addTrees(
      elements,
      centerLat,
      centerLon,
      trunkMaterial,
      coniferCrownMaterial,
      deciduousCrownMaterial,
      buildingFootprints = [],
      roadClearanceSegments = [],
      bushMaterial = null
    ) {
      const occupied = new Set();
      const forestTrees = generateForestTrees(
        elements,
        centerLat,
        centerLon,
        occupied,
        buildingFootprints,
        roadClearanceSegments
      );
      const osmTrees = collectTrees(
        elements,
        centerLat,
        centerLon,
        occupied,
        buildingFootprints,
        roadClearanceSegments
      );
      const conifers = forestTrees.conifers.concat(osmTrees.conifers);
      const deciduous = forestTrees.deciduous.concat(osmTrees.deciduous);

      const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.65, 1, 8);
      const sphereCrownGeometry = new THREE.SphereGeometry(1, 10, 8);
      const coneCrownGeometry = new THREE.ConeGeometry(1, 1, 10);

      buildTreeInstances(conifers, trunkGeometry, sphereCrownGeometry, trunkMaterial, coniferCrownMaterial, true);
      buildTreeInstances(deciduous, trunkGeometry, coneCrownGeometry, trunkMaterial, deciduousCrownMaterial, false);

      if (bushMaterial) {
        const bushOccupied = new Set();
        const bushes = generateScrubBushes(
          elements,
          centerLat,
          centerLon,
          bushOccupied,
          buildingFootprints,
          roadClearanceSegments
        );
        buildBushInstances(bushes, bushMaterial);
      }
    }

    function addGroundPlane(groundMaterial) {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(SECTOR_SIZE, SECTOR_SIZE),
        groundMaterial
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = Y_GROUND;
      ground.renderOrder = 0;
      worldGroup.add(ground);
    }

    function setLoading(visible) {
      loadingEl.classList.toggle("visible", visible);
    }

    async function geocodeAddress(query) {
      const url = new URL("https://nominatim.openstreetmap.org/search");
      url.searchParams.set("q", query);
      url.searchParams.set("format", "json");
      url.searchParams.set("limit", "1");

      const response = await fetch(url.toString(), {
        headers: {
          Accept: "application/json",
          "Accept-Language": "pl",
        },
      });
      if (!response.ok) throw new Error(`Geokodowanie HTTP ${response.status}`);

      const results = await response.json();
      if (!results.length) throw new Error("Nie znaleziono adresu");

      const hit = results[0];
      return {
        lat: parseFloat(hit.lat),
        lon: parseFloat(hit.lon),
        label: hit.display_name || query,
      };
    }

    async function searchAndLoadAddress() {
      const query = searchInput.value.trim();
      if (!query) return;

      searchBtn.disabled = true;
      try {
        statusEl.textContent = "Szukam adresu…";
        const result = await geocodeAddress(query);
        await loadSector(result.lat, result.lon, result.label);
      } catch (error) {
        statusEl.textContent = `BLAD: ${error.message}`;
        setLoading(false);
      } finally {
        searchBtn.disabled = false;
      }
    }

    async function loadSector(lat, lon, placeLabel = null) {
      setLoading(true);
      statusEl.textContent = `LAT: ${lat.toFixed(5)} | LON: ${lon.toFixed(5)} | SEKTOR: ${SECTOR_SIZE}m`;
      try {
        const data = await fetchMapData(bboxFromCenter(lat, lon, SECTOR_HALF));
        clearWorld();
        windowSlots = [];

        const wallMaterial = new THREE.MeshBasicMaterial({
          map: createWallTexture(),
          side: THREE.DoubleSide,
          polygonOffset: true,
          polygonOffsetFactor: 3,
          polygonOffsetUnits: 3,
        });
        const capMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          depthWrite: false,
          depthTest: false,
        });
        const roofMaterial = new THREE.MeshBasicMaterial({
          map: createRoofTexture(),
          color: 0xffffff,
          side: THREE.DoubleSide,
          depthWrite: true,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1,
        });
        const groundMaterial = new THREE.MeshBasicMaterial({
          color: GROUND_COLOR,
          polygonOffset: true,
          polygonOffsetFactor: 3,
          polygonOffsetUnits: 3,
        });
        const windowMaterial = new THREE.MeshBasicMaterial({
          map: createWindowTexture(),
          side: THREE.FrontSide,
          depthTest: true,
          depthWrite: true,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
        });

        addGroundPlane(groundMaterial);

        const residentialMaterial = new THREE.MeshBasicMaterial({
          color: RESIDENTIAL_COLOR,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1,
        });
        const buildingFootprints = collectBuildingFootprints(data.elements || [], lat, lon);
        addResidentialFloors(data.elements || [], lat, lon, residentialMaterial);

        const greenMaterials = {
          forest: new THREE.MeshBasicMaterial({
            color: FOREST_COLOR,
            side: THREE.DoubleSide,
            depthWrite: true,
            depthTest: true,
            polygonOffset: true,
            polygonOffsetFactor: 4,
            polygonOffsetUnits: 4,
          }),
          park: new THREE.MeshBasicMaterial({
            color: PARK_GREEN_COLOR,
            side: THREE.DoubleSide,
            depthWrite: true,
            depthTest: true,
            polygonOffset: true,
            polygonOffsetFactor: 3,
            polygonOffsetUnits: 3,
          }),
          allotment: new THREE.MeshBasicMaterial({
            color: ALLOTMENT_COLOR,
            side: THREE.DoubleSide,
            depthWrite: true,
            depthTest: true,
            polygonOffset: true,
            polygonOffsetFactor: 3,
            polygonOffsetUnits: 3,
          }),
          scrub: new THREE.MeshBasicMaterial({
            color: SCRUB_COLOR,
            side: THREE.DoubleSide,
            depthWrite: true,
            depthTest: true,
            polygonOffset: true,
            polygonOffsetFactor: 3,
            polygonOffsetUnits: 3,
          }),
        };
        addGreenAreaFloors(data.elements || [], lat, lon, greenMaterials, buildingFootprints);

        for (const building of iterBuildings(data.elements || [])) {
          if (building.isPart) continue;
          addBuilding(building, lat, lon, wallMaterial, roofMaterial, capMaterial);
        }
        for (const building of iterBuildings(data.elements || [])) {
          if (!building.isPart) continue;
          addBuilding(building, lat, lon, wallMaterial, roofMaterial, capMaterial);
        }
        const roadBorderMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: -4,
          polygonOffsetUnits: -4,
        });
        const roadSurfaceMaterial = new THREE.MeshBasicMaterial({
          color: 0x080808,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: -3,
          polygonOffsetUnits: -3,
        });
        const roadDividerMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: -2,
          polygonOffsetUnits: -2,
        });

        buildWindowInstances(windowMaterial);
        addRoads(
          data.elements || [],
          lat,
          lon,
          roadBorderMaterial,
          roadSurfaceMaterial,
          roadDividerMaterial,
          buildingFootprints
        );

        const footwayMaterial = new THREE.MeshBasicMaterial({
          color: FOOTWAY_COLOR,
          side: THREE.DoubleSide,
          depthWrite: true,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: -2,
          polygonOffsetUnits: -2,
        });
        addFootways(data.elements || [], lat, lon, footwayMaterial);

        const roadClearanceSegments = collectRoadClearanceSegments(data.elements || [], lat, lon);
        const treeTrunkMaterial = new THREE.MeshBasicMaterial({ color: 0x5a3d28 });
        const coniferCrownMaterial = new THREE.MeshBasicMaterial({ color: 0x1a4228 });
        const deciduousCrownMaterial = new THREE.MeshBasicMaterial({ color: 0x245032 });
        const bushMaterial = new THREE.MeshBasicMaterial({ color: 0x3d5c3a });
        addTrees(
          data.elements || [],
          lat,
          lon,
          treeTrunkMaterial,
          coniferCrownMaterial,
          deciduousCrownMaterial,
          buildingFootprints,
          roadClearanceSegments,
          bushMaterial
        );

        setFixedCamera();
        requestRender();
        if (placeLabel) {
          const shortLabel = placeLabel.split(",").slice(0, 2).join(",").trim();
          statusEl.textContent = `${shortLabel} | LAT: ${lat.toFixed(5)} | LON: ${lon.toFixed(5)} | SEKTOR: ${SECTOR_SIZE}m`;
        }
      } catch (error) {
        statusEl.textContent = `BLAD: ${error.message}`;
      } finally {
        setLoading(false);
      }
    }

    function tick() {
      requestAnimationFrame(tick);
      if (needsRender) {
        renderer.render(scene, camera);
        needsRender = false;
      }
    }

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      searchAndLoadAddress();
    });

    loadSector(START_LAT, START_LON);
    tick();
  </script>
</body>
</html>
